<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz de Logística</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #fbd9e8;
    color: #5b3a49;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px;
  }

  .quiz-container {
    width: 100%;
    max-width: 720px;
    background: #fff1f7;
    border-radius: 28px;
    padding: 30px;
    box-shadow: 0 12px 35px rgba(120, 70, 95, .18);
  }

  h1 {
    text-align: center;
    margin: 0 0 8px;
    color: #c66b93;
    font-size: 2.2rem;
  }

  .subtitle {
    text-align: center;
    margin: 0 0 25px;
    color: #8d6576;
  }

  .question {
    display: none;
    animation: aparecer .3s ease;
  }

  .question.active { display: block; }

  @keyframes aparecer {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .question h2 {
    font-size: 1.3rem;
    line-height: 1.4;
    margin-bottom: 18px;
  }

  .answer {
    width: 100%;
    border: 2px solid #f0dce5;
    background: white;
    color: #604451;
    padding: 16px 18px;
    margin: 11px 0;
    border-radius: 22px;
    font-size: 1rem;
    text-align: left;
    cursor: pointer;
    transition: .2s;
    box-shadow: 0 4px 10px rgba(120, 70, 95, .08);
  }

  .answer:hover {
    transform: translateY(-2px);
    border-color: #df9fbb;
    background: #fffafd;
  }

  .answer.correct {
    background: #dff5e5;
    border-color: #8bc99b;
  }

  .answer.wrong {
    background: #ffe1e1;
    border-color: #e89a9a;
  }

  .answer:disabled { cursor: default; }

  .feedback {
    margin-top: 15px;
    padding: 12px 15px;
    border-radius: 15px;
    display: none;
    font-weight: bold;
  }

  .next {
    display: none;
    width: 100%;
    margin-top: 16px;
    padding: 14px;
    border: none;
    border-radius: 18px;
    background: #d786aa;
    color: white;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
  }

  .progress {
    text-align: center;
    margin-bottom: 20px;
    color: #9a6a80;
    font-size: .95rem;
  }

  #result {
    display: none;
    text-align: center;
  }

  #result h2 { color: #c66b93; }

  .score {
    font-size: 2rem;
    font-weight: bold;
    color: #c66b93;
    margin: 20px 0;
  }

  .restart {
    border: none;
    background: #d786aa;
    color: white;
    padding: 14px 25px;
    border-radius: 18px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>

<body>
<div class="quiz-container">
  <h1>Quiz de Logística</h1>
  <p class="subtitle">Teste seus conhecimentos!</p>

  <div id="quiz">
    <div class="progress" id="progress"></div>

    <div class="question active" data-answer="A">
      <h2>1. O que é logística?</h2>
      <button class="answer" data-value="A">A) Organizar o transporte e os produtos</button>
      <button class="answer" data-value="B">B) Fazer propaganda</button>
      <button class="answer" data-value="C">C) Criar produtos</button>
      <button class="answer" data-value="D">D) Contratar funcionários</button>
      <div class="feedback"></div>
      <button class="next">Próxima questão →</button>
    </div>

    <div class="question" data-answer="A">
      <h2>2. O que é estoque?</h2>
      <button class="answer" data-value="A">A) Produtos guardados</button>
      <button class="answer" data-value="B">B) Dinheiro da empresa</button>
      <button class="answer" data-value="C">C) Caminhões</button>
      <button class="answer" data-value="D">D) Funcionários</button>
      <div class="feedback"></div>
      <button class="next">Próxima questão →</button>
    </div>

    <div class="question" data-answer="A">
      <h2>3. Para que serve o transporte?</h2>
      <button class="answer" data-value="A">A) Levar produtos de um lugar para outro</button>
      <button class="answer" data-value="B">B) Fabricar produtos</button>
      <button class="answer" data-value="C">C) Guardar produtos</button>
      <button class="answer" data-value="D">D) Vender produtos</button>
      <div class="feedback"></div>
      <button class="next">Ver resultado →</button>
    </div>
  </div>

  <div id="result">
    <h2>Quiz concluído!</h2>
    <div class="score" id="score"></div>
    <p>Parabéns por participar! 💗</p>
    <button class="restart" onclick="restartQuiz()">Refazer quiz</button>
  </div>
</div>

<script>
const questions = [...document.querySelectorAll('.question')];
let current = 0;
let score = 0;

function updateProgress() {
  document.getElementById('progress').textContent =
    `Questão ${current + 1} de ${questions.length}`;
}

function setupQuestion(question) {
  const answers = question.querySelectorAll('.answer');
  const feedback = question.querySelector('.feedback');
  const next = question.querySelector('.next');

  answers.forEach(button => {
    button.addEventListener('click', () => {
      answers.forEach(b => b.disabled = true);

      const selected = button.dataset.value;
      const correct = question.dataset.answer;

      if (selected === correct) {
        button.classList.add('correct');
        feedback.textContent = '✓ Resposta correta!';
        feedback.style.background = '#dff5e5';
        feedback.style.color = '#39734a';
        score++;
      } else {
        button.classList.add('wrong');
        const correctButton = question.querySelector(`[data-value="${correct}"]`);
        correctButton.classList.add('correct');
        feedback.textContent = '✗ Resposta incorreta. A alternativa correta está destacada em verde.';
        feedback.style.background = '#ffe1e1';
        feedback.style.color = '#9a4444';
      }

      feedback.style.display = 'block';
      next.style.display = 'block';
    });
  });

  next.addEventListener('click', () => {
    question.classList.remove('active');

    if (current < questions.length - 1) {
      current++;
      questions[current].classList.add('active');
      updateProgress();
    } else {
      document.getElementById('quiz').style.display = 'none';
      document.getElementById('result').style.display = 'block';
      document.getElementById('score').textContent =
        `${score} de ${questions.length} acertos`;
    }
  });
}

questions.forEach(setupQuestion);
updateProgress();

function restartQuiz() {
  current = 0;
  score = 0;

  questions.forEach(q => {
    q.classList.remove('active');
    q.querySelectorAll('.answer').forEach(b => {
      b.disabled = false;
      b.classList.remove('correct', 'wrong');
    });
    q.querySelector('.feedback').style.display = 'none';
    q.querySelector('.next').style.display = 'none';
  });

  questions[0].classList.add('active');
  document.getElementById('quiz').style.display = 'block';
  document.getElementById('result').style.display = 'none';
  updateProgress();
}
</script>
</body>
</html>
